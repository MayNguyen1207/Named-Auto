name: Scheduled Automated Tests

on:
  # Hiện tại đang TẮT tự động chạy. Khi nào muốn chạy thật, bạn chỉ cần xóa dấu # ở 3 dòng dưới này.
  schedule:
     - cron: '23 4 * * 2,4'   # 11h23 trưa Thứ 3 và Thứ 5 (Giờ VN)
  
  workflow_dispatch: 

env:
  NODE_TLS_REJECT_UNAUTHORIZED: '0'

jobs:
  test:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      if: always()
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run tests
      run: npm test
      continue-on-error: true

    - name: Download Previous Allure History
      if: always()
      uses: dawidd6/action-download-artifact@v9
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: run-tests.yml
        name: allure-report-artifact
        path: previous-allure-report
        check_artifacts: true
        search_artifacts: true
        if_no_artifact_found: warn

    - name: Copy History to Results
      if: always()
      run: |
          if (Test-Path "previous-allure-report/history") {
              if (!(Test-Path "allure-results/history")) {
                  New-Item -ItemType Directory -Force -Path "allure-results/history"
              }
              Copy-Item -Path "previous-allure-report/history/*" -Destination "allure-results/history/" -Recurse -Force
              Write-Output "History found and mapped successfully!"
          } else {
              Write-Output "History not found."
          }

    - name: Install Allure Commandline & Combiner
      if: always()
      run: |
        npm install -g allure-commandline
        pip install allure-combine

    - name: Generate Allure Report
      if: always()
      run: allure generate allure-results --clean -o allure-report
    
    - name: Combine Allure Report into Single File
      if: always()
      run: allure-combine allure-report

    - name: Upload Allure Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-artifact
        path: allure-report/complete.html
        retention-days: 30