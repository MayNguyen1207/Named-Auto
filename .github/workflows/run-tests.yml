name: Scheduled Automated Tests

on:
  # Hiện tại đang TẮT tự động chạy. Khi nào muốn chạy thật, bạn chỉ cần xóa dấu # ở 3 dòng dưới này.
  schedule:
     - cron: '52 22 * * 1,3'   # 5h52 sáng Thứ 4 và Thứ 6 (Giờ VN)
  
  workflow_dispatch: 

env:
  NODE_TLS_REJECT_UNAUTHORIZED: '0'

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clean Old Folders on Windows
      shell: powershell
      run: |
        foreach ($folder in @("allure-results", "allure-report", "old-history", "previous-allure-report")) {
            if (Test-Path $folder) {
                Remove-Item -Path $folder -Recurse -Force
                Write-Output "Đã dọn dẹp thư mục rác: $folder"
            }
        }

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      if: always()
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run tests
      run: npm test
      continue-on-error: true

    - name: Download Previous Allure History
      if: always()
      uses: dawidd6/action-download-artifact@v9
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: run-tests.yml
        name: allure-history-artifact
        path: allure-results/history
        check_artifacts: true
        search_artifacts: true
        if_no_artifact_found: warn

    - name: Install Allure Commandline & Combiner
      if: always()
      run: |
        npm install -g allure-commandline@2.29.0
        pip install allure-combine

    - name: Generate Allure Report
      if: always()
      run: allure generate allure-results --clean -o allure-report
    
    - name: Combine Allure Report into Single File
      if: always()
      run: allure-combine allure-report
      
    - name: Upload Allure Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-artifact
        path: allure-report/complete.html
        retention-days: 30

    - name: Save History for Next Run (Internal)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-history-artifact
        path: allure-report/history
        retention-days: 30

    - name: Update Excel Trend on Drive & Send Report to Telegram
      if: always()
      shell: powershell
      run: |
        $excelPath = ".\Automation_Trend_Report.xlsx"
        $summaryPath = ".\allure-report\widgets\summary.json"
        $token = "${{ secrets.TELEGRAM_TOKEN }}"
        $chat_id = "-5572929777"
        
        # 1. Download file from GG Drive to host machine
        rclone copy "gdrive:Automation_Reports/Automation_Trend_Report.xlsx" ".\"

        # 2. Automatically install Excel library
        if (-not (Get-Module -ListAvailable -Name ImportExcel)) {
            Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Confirm:$false
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module ImportExcel -Force -Scope CurrentUser -AllowClobber -Confirm:$false
        }

        # 3. Read data from Allure's summary file
        if (Test-Path $summaryPath) {
            $summary = Get-Content $summaryPath | ConvertFrom-Json
            $total  = $summary.statistic.total
            $passed = $summary.statistic.passed
            $failed = $summary.statistic.failed
            $broken = $summary.statistic.broken
            $skipped = $summary.statistic.skipped
            $unknown = $summary.statistic.unknown
            $passRate = [math]::Round(($passed / $total) * 100, 2)
        } else {
            $total = $passed = $failed = $broken = $skipped = $unknown = 0
            $passRate = 0
        }

        # 4. Add a new row to the downloaded Excel file
        $newRow = [PSCustomObject]@{
            "Date Time"   = $(Get-Date -Format 'dd/MM/yyyy HH:mm')
            "Total Cases" = $total
            "Passed"      = $passed
            "Failed"      = $failed
            "Broken"      = $broken
            "Skipped"     = $skipped
            "Unknown"     = $unknown
            "Pass Rate"   = $passRate
        }
        $newRow | Export-Excel -Path $excelPath -Append -WorksheetName "Trend_History"

        # 5. Upload the updated Excel file to Google Drive
        rclone copy ".\Automation_Trend_Report.xlsx" "gdrive:Automation_Reports"

        # 6. Send a notice message
        $gdriveLink = "https://docs.google.com/spreadsheets/d/1VeHwr98lM0M-WOMlnxUHjOm8DA2IWHDC/edit?gid=1378902928#gid=1378902928"
        $text = "*AUTOMATION TEST REPORT*`n" +
                "------------------------------------`n" +
                "Time: $(Get-Date -Format 'dd/MM/yyyy HH:mm')`n" +
                "Total test: *$total*`n" +
                "Pass: *$passed* |  Fail: *$failed* |  Broken: *$broken*`n" +
                "Skipped: *$skipped* | Unknown: *$unknown*`n" +
                "Pass Rate: *$passRate%*`n" +
                "------------------------------------`n" +
                "Read the online trend report:`n$gdriveLink`n`n" +
                "Or read the detail report below."
        curl.exe -X POST "https://api.telegram.org/bot$token/sendMessage" `
          -d "chat_id=$chat_id" `
          -d "text=$text" `
          -d "parse_mode=Markdown"

        # 7. Attach complete.html file
        $filePath = ".\allure-report\complete.html"
        if (Test-Path $filePath) {
            curl.exe -X POST "https://api.telegram.org/bot$token/sendDocument" `
              -F "chat_id=$chat_id" `
              -F "document=@$filePath"
        }