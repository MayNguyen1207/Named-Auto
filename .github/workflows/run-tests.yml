name: Scheduled Automated Tests

on:
  # Hiện tại đang TẮT tự động chạy. Khi nào muốn chạy thật, bạn chỉ cần xóa dấu # ở 3 dòng dưới này.
  schedule:
     - cron: '52 22 * * 2,4'   # 5h52 sáng Thứ 4 và Thứ 6 (Giờ VN)
  
  workflow_dispatch: 

env:
  NODE_TLS_REJECT_UNAUTHORIZED: '0'

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Clean Old Folders on Windows
      shell: powershell
      run: |
        foreach ($folder in @("allure-results", "allure-report", "old-history", "previous-allure-report")) {
            if (Test-Path $folder) {
                Remove-Item -Path $folder -Recurse -Force
                Write-Output "Đã dọn dẹp thư mục rác: $folder"
            }
        }

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      if: always()
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run tests
      run: npm test
      continue-on-error: true

    - name: Download Previous Allure History
      if: always()
      uses: dawidd6/action-download-artifact@v9
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: run-tests.yml
        name: allure-history-artifact
        path: allure-results/history
        check_artifacts: true
        search_artifacts: true
        if_no_artifact_found: warn

    - name: Install Allure Commandline & Combiner
      if: always()
      run: |
        npm install -g allure-commandline@2.29.0
        pip install allure-combine

    - name: Generate Allure Report
      if: always()
      run: allure generate allure-results --clean -o allure-report
    
    - name: Combine Allure Report into Single File
      if: always()
      run: allure-combine allure-report
      
    - name: Upload Allure Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-artifact
        path: allure-report/complete.html
        retention-days: 30

    - name: Save History for Next Run (Internal)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-history-artifact
        path: allure-report/history
        retention-days: 30

    - name: Send Report to Telegram
      if: always()
      run: |
        $token = "8306821402:AAGxFzRLLW3pTW5ZN7SKiNN00R9b-ecXnSA"
        $chat_id = "-5572929777"
        
        # 1. Send a notice message
        $text = "🔔 *Automation Test Report*`n⏱ Time: $(Get-Date -Format 'dd/MM/yyyy HH:mm')`n🚀 Please read the detail report below."
        curl.exe -X POST "https://api.telegram.org/bot$token/sendMessage" `
          -d "chat_id=$chat_id" `
          -d "text=$text" `
          -d "parse_mode=Markdown"

        # 2. Attach complete.html file
        $filePath = ".\allure-report\complete.html"
        curl.exe -X POST "https://api.telegram.org/bot$token/sendDocument" `
          -F "chat_id=$chat_id" `
          -F "document=@$filePath"