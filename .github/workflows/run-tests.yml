name: Scheduled Automated Tests

on:
  # Hiện tại đang TẮT tự động chạy. Khi nào muốn chạy thật, bạn chỉ cần xóa dấu # ở 3 dòng dưới này.
  # schedule:
  #   - cron: '0 23 * * 1,3'   # 6h sáng Thứ 3 và Thứ 5 (Giờ VN)
  
  # Giữ lại cái này để bạn có thể bấm nút "Run workflow" bằng tay trên web để test thử trước
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Cài đặt môi trường
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run tests
      run: npm test