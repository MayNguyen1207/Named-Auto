name: Scheduled Automated Tests

on:
  # Hiện tại đang TẮT tự động chạy. Khi nào muốn chạy thật, bạn chỉ cần xóa dấu # ở 3 dòng dưới này.
  schedule:
     - cron: '23 4 * * 2,4'   # 11h23 trưa Thứ 3 và Thứ 5 (Giờ VN)
  
  workflow_dispatch: 

env:
  NODE_TLS_REJECT_UNAUTHORIZED: '0'

jobs:
  test:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run tests
      run: npm test
      continue-on-error: true

    - name: Download Previous Allure History
      if: always()
      uses: dawidd6/action-download-artifact@v9
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        workflow: run-tests.yml
        name: allure-report-artifact
        path: previous-allure-report
        check_artifacts: true
        search_artifacts: true
        if_no_artifact_found: warn

    - name: Copy History to Results
      if: always()
      shell: bash
      run: |
        if [ -d "previous-allure-report/history" ]; then
          cp -r previous-allure-report/history allure-results/
          echo "History found!"
        else
          echo "History not found."
        fi

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Install Allure Commandline
      if: always()
      run: npm install -g allure-commandline

    - name: Generate Allure Report
      if: always()
      run: allure generate allure-results --clean -o allure-report

    - name: Upload Allure Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-artifact
        path: allure-report
        retention-days: 30